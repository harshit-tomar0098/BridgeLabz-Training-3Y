<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Travel Selection</title></head>
<body>
<h1>Choose Your Travel Preferences</h1>
<label for="country">Country:</label>
<select id="country"><option>India</option><option>Japan</option><option>France</option></select><br><br>
<label for="state">State:</label>
<select id="state"><option>Uttar Pradesh</option><option>Rajasthan</option><option>Goa</option></select><br><br>
<label for="city">City:</label>
<select id="city"><option>Agra</option><option>Jaipur</option><option>Varanasi</option></select><br><br>
<label for="place">Favorite Tourist Place:</label>
<select id="place"><option>Taj Mahal</option><option>Amer Fort</option><option>Gateway of India</option></select>
<p>My choices are India, Uttar Pradesh, Agra, and the Taj Mahal as my favorite tourist place.</p>
</body>
</html>
