<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio Basics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="personal-portfolio-basics.css">
</head>
<body class="bg-light text-dark">
<header class="container text-center mt-4">
    <h1 class="fw-bold">Aarav Sharma</h1>
    <p class="lead">Frontend Developer &amp; UI Enthusiast</p>
</header>
<main class="container text-center py-5">
    <section class="p-5 bg-white rounded shadow-sm">
        <!-- img-fluid makes the image responsive; rounded-circle creates a profile image. -->
        <img src="https://i.pravatar.cc/300?img=12" class="img-fluid rounded-circle profile-img mb-4" alt="Aarav Sharma profile">
        <h2 class="fw-bold">Creating clean and useful web experiences</h2>
        <p class="mb-4">I build responsive websites with accessible interfaces, thoughtful layouts, and modern frontend practices.</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap mb-4">
            <a href="#contact" class="btn btn-primary">Hire Me</a>
            <a href="#" class="btn btn-outline-dark">Download CV</a>
        </div>
        <form id="contact" class="mx-auto contact-form text-start">
            <label for="email" class="form-label fw-bold">Email</label>
            <input type="email" id="email" class="form-control mb-3" placeholder="you@example.com">
            <label for="message" class="form-label fw-bold">Message</label>
            <textarea id="message" class="form-control mb-3" rows="4" placeholder="Tell me about your project"></textarea>
            <button type="submit" class="btn btn-dark">Send Message</button>
        </form>
    </section>
</main>
<footer class="text-center py-4 bg-dark text-white">&copy; 2026 Aarav Sharma</footer>
</body>
</html>
