<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker with Badges</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task-tracker-with-badges.css">
</head>
<body>
<main class="container py-5">
    <header class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div><h1 class="fw-bold mb-1">Task Tracker</h1><p class="mb-0 text-muted">Stay focused on today's work.</p></div>
        <!-- Badge provides a compact pending-task counter. -->
        <span class="badge text-bg-primary fs-6">5 Pending</span>
    </header>
    <section>
        <!-- list-group creates a clean responsive task list. -->
        <ul class="list-group shadow-sm">
            <li class="list-group-item d-flex justify-content-between align-items-center">Prepare presentation <span class="badge text-bg-danger">High</span></li>
            <li class="list-group-item d-flex justify-content-between align-items-center">Review project code <span class="badge text-bg-warning">Medium</span></li>
            <li class="list-group-item d-flex justify-content-between align-items-center">Update documentation <span class="badge text-bg-secondary">Low</span></li>
            <li class="list-group-item d-flex justify-content-between align-items-center">Submit assignment <span class="badge text-bg-danger">High</span></li>
            <li class="list-group-item d-flex justify-content-between align-items-center">Plan tomorrow's tasks <span class="badge text-bg-warning">Medium</span></li>
        </ul>
        <button class="btn btn-success mt-4">Completed <span class="badge text-bg-light">3</span></button>
    </section>
</main>
</body>
</html>
