<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="product-catalog.css">
</head>
<body>
<header class="py-4 bg-dark text-white text-center">
    <h1 class="fw-bold">Urban Cart</h1>
    <p class="mb-0">Everyday products, thoughtfully selected.</p>
</header>
<main class="container py-5">
    <div class="row g-4">
        <!-- col-md-3 gives four columns on medium and larger screens. -->
        <article class="col-12 col-sm-6 col-md-3">
            <div class="card h-100 shadow-sm product-card">
                <img src="https://picsum.photos/id/1060/500/350" class="card-img-top" alt="Wireless headphones">
                <div class="card-body"><h2 class="h5">Wireless Headphones</h2><p class="fw-bold">₹2,499</p><button class="btn btn-primary">Add to Cart</button></div>
            </div>
        </article>
        <article class="col-12 col-sm-6 col-md-3">
            <div class="card h-100 shadow-sm product-card">
                <img src="https://picsum.photos/id/96/500/350" class="card-img-top" alt="Travel backpack">
                <div class="card-body"><h2 class="h5">Travel Backpack</h2><p class="fw-bold">₹1,899</p><button class="btn btn-primary">Add to Cart</button></div>
            </div>
        </article>
        <article class="col-12 col-sm-6 col-md-3">
            <div class="card h-100 shadow-sm product-card">
                <img src="https://picsum.photos/id/30/500/350" class="card-img-top" alt="Coffee workspace set">
                <div class="card-body"><h2 class="h5">Desk Coffee Set</h2><p class="fw-bold">₹999</p><button class="btn btn-primary">Add to Cart</button></div>
            </div>
        </article>
        <article class="col-12 col-sm-6 col-md-3">
            <div class="card h-100 shadow-sm product-card">
                <img src="https://picsum.photos/id/201/500/350" class="card-img-top" alt="Travel camera">
                <div class="card-body"><h2 class="h5">Compact Camera</h2><p class="fw-bold">₹12,499</p><button class="btn btn-primary">Add to Cart</button></div>
            </div>
        </article>
    </div>
</main>
<footer class="text-center py-4 bg-light">Free delivery on orders above ₹999.</footer>
</body>
</html>
