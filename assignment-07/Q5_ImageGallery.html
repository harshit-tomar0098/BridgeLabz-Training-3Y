<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery with Modal</title>
  <link rel="stylesheet" href="Q5_ImageGallery.css">
</head>
<body>
  <main class="container">
    <h1>Image Gallery</h1>
    <div class="gallery" id="gallery">
      <img src="https://picsum.photos/id/1015/300/200" alt="Mountain river">
      <img src="https://picsum.photos/id/1016/300/200" alt="Mountain landscape">
      <img src="https://picsum.photos/id/1025/300/200" alt="Dog portrait">
      <img src="https://picsum.photos/id/1035/300/200" alt="Forest path">
      <img src="https://picsum.photos/id/1043/300/200" alt="Ocean coast">
      <img src="https://picsum.photos/id/106/300/200" alt="Nature view">
    </div>
  </main>
  <div id="imageModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button id="closeModal" class="close-button" aria-label="Close modal">&times;</button>
      <img id="modalImage" src="" alt="Expanded gallery image">
    </div>
  </div>
  <script src="Q5_ImageGallery.js"></script>
</body>
</html>
