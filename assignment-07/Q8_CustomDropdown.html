<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Dropdown</title>
  <link rel="stylesheet" href="Q8_CustomDropdown.css">
</head>
<body>
  <main class="container">
    <h1>Custom Dropdown</h1>
    <div class="dropdown" id="dropdown">
      <button id="dropdownButton" aria-expanded="false">Select a fruit</button>
      <ul id="dropdownOptions" class="options" hidden>
        <li data-value="Apple">Apple</li>
        <li data-value="Banana">Banana</li>
        <li data-value="Mango">Mango</li>
        <li data-value="Orange">Orange</li>
      </ul>
    </div>
  </main>
  <script src="Q8_CustomDropdown.js"></script>
</body>
</html>
