<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 07 - Product Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <!-- Product Image Section -->
        <div class="image-section">

            <img src="product.jpg" alt="Sports Shoes">

            <!-- Discount Badge -->
            <div class="discount">
                20% OFF
            </div>

            <!-- Heart Button -->
            <div class="heart">
                ♡
            </div>

        </div>


        <!-- Product Details -->
        <div class="details">

            <div class="category">
                SPORTS SHOES
            </div>

            <h2>
                Premium Running Shoes
            </h2>

            <!-- Rating -->
            <div class="rating">
                <span class="stars">★ ★ ★ ★ ★</span>
                <span class="reviews">(120)</span>
            </div>

            <!-- Price -->
            <div class="price">
                <span class="current-price">₹1,999</span>
                <span class="old-price">₹2,499</span>
            </div>

            <!-- Add to Cart -->
            <button>
                Add to Cart
            </button>

        </div>

    </div>

</body>
</html>
