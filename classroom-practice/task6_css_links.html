<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            margin: 0;
            background: #eef3fb;
            font-family: Georgia, "Times New Roman", serif;
        }

        .links-box {
            width: 70%;
            margin: 30px auto;
            border: 3px solid #222;
            border-radius: 45px;
            overflow: hidden;
            background: white;
        }

        h1 {
            margin: 0;
            padding: 28px;
            text-align: center;
            font-size: 64px;
            background: #12d3e6;
            border-bottom: 2px solid #aaa;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #aaa;
            font-size: 58px;
        }

        li:last-child {
            border-bottom: none;
        }

        li:nth-child(2) {
            background: #45ed7d;
        }

        a {
            color: #26056f;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="links-box">
        <h1>Links</h1>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>
</body>
</html>
