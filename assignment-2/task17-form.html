<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Page</title>
</head>
<body>
    <h1>Submit Form</h1>

    <form action="result.html" method="get" target="resultFrame">
        <label for="text">Enter Text:</label>
        <input type="text" id="text" name="text" required>
        <button type="submit">Submit</button>
    </form>

    <br>

    <iframe
        src="result.html"
        name="resultFrame"
        width="80%"
        height="150"
        title="Form result">
    </iframe>
</body>
</html>
