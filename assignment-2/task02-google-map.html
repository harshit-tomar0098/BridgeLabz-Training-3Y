<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>
    <h1>My City on Google Maps</h1>

    <!-- loading="lazy" tells the browser to load the map only when it is needed/near the viewport. -->
    <iframe
        src="https://www.google.com/maps?q=GLA+University+Mathura&output=embed"
        title="Google Map showing GLA University"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
