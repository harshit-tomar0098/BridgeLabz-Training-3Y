<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The title sets the name displayed in the browser tab. -->
    <title>Important Head Elements</title>

    <!-- The charset defines the character encoding used by the webpage. -->
    <meta charset="UTF-8">

    <!-- The description gives search engines a short description of the page. -->
    <meta name="description" content="A webpage demonstrating important HTML head elements.">

    <!-- The author identifies the creator of the webpage. -->
    <meta name="author" content="Anubhav">

    <!-- The base tag sets the base URL used for relative URLs. -->
    <base href="https://example.com/">

    <!-- The link tag can connect the page to external resources such as a favicon. -->
    <link rel="icon" href="favicon.ico">

    <!-- The style tag contains CSS rules for the webpage. -->
    <style>
    </style>

    <!-- The script tag contains or connects JavaScript code. -->
    <script>
    </script>
</head>
<body>
    <h1>Important HTML Head Elements</h1>
    <p>This page demonstrates important elements used inside the head section.</p>
</body>
</html>
