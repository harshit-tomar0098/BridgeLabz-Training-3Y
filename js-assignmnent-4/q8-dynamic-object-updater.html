<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8 - Dynamic Object Updater</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
        label { display: block; margin-top: 14px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 5px; }
        button { margin-top: 18px; padding: 10px 16px; }
        pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Edit User</h1>
    <form id="userForm">
        <label for="name">Name</label>
        <input id="name" name="name" value="John" required>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="john@mail.com" required>
        <label for="age">Age</label>
        <input id="age" name="age" type="number" min="1" step="1" value="21" required>
        <button type="submit">Update User</button>
    </form>
    <h2>Updated user object</h2>
    <pre id="userOutput"></pre>
    <script src="q8-dynamic-object-updater.js"></script>
</body>
</html>
