<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q5 - Movie Ticket Booking</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
        label { display: block; margin-top: 14px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 5px; }
        .error { color: #c62828; min-height: 18px; }
        .valid { border: 2px solid #16803c; }
        .invalid { border: 2px solid #c62828; }
        button { margin-top: 16px; padding: 10px 16px; }
        #ticket { border: 1px dashed #555; padding: 14px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Movie Ticket Booking</h1>
    <form id="bookingForm" novalidate>
        <label for="name">Name</label>
        <input id="name" autocomplete="name">
        <div id="nameError" class="error"></div>

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email">
        <div id="emailError" class="error"></div>

        <label for="seats">Seats (1–10)</label>
        <input id="seats" type="number" min="1" max="10" step="1" value="1">
        <div id="seatsError" class="error"></div>

        <button type="submit">Book Tickets</button>
    </form>
    <div id="ticket" hidden></div>
    <script src="q5-movie-ticket-booking.js"></script>
</body>
</html>
