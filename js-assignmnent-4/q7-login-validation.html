<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q7 - Login Validation</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
        label { display: block; margin-top: 14px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 5px; }
        .error { color: #c62828; }
        .success { color: #16803c; }
        button { margin-top: 18px; padding: 10px 16px; }
    </style>
</head>
<body>
    <h1>Login Form Validation</h1>
    <form id="loginForm" novalidate>
        <label for="username">Username</label>
        <input id="username" autocomplete="username">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
        <button type="submit">Validate Login</button>
    </form>
    <div id="messages" aria-live="polite"></div>
    <script src="q7-login-validation.js"></script>
</body>
</html>
