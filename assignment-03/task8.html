<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="task8.css">
</head>
<body>
    <main>
        <h1>CSS Box Model</h1>
        <section class="models">
            <article class="model default">
                <div class="content">Content<br><small>Content area</small></div>
                <p>Default content-box</p>
            </article>
            <article class="model border-box">
                <div class="content">Content<br><small>Padding + border fit inside set size</small></div>
                <p>box-sizing: border-box</p>
            </article>
        </section>
        <section class="legend">
            <p><strong>Content:</strong> actual text or element data.</p>
            <p><strong>Padding:</strong> space inside the border.</p>
            <p><strong>Border:</strong> edge around padding and content.</p>
            <p><strong>Margin:</strong> space outside the border.</p>
        </section>
    </main>
</body>
</html>
