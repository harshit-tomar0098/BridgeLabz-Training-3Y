<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
    <header>
        <h1>Filter Comparison</h1>
    </header>

    <main>
        <section class="comparison">
            <article class="image-box">
                <img src="https://picsum.photos/id/1015/600/400" alt="Original mountain image">
                <h2>Before</h2>
                <p>Original Image</p>
            </article>

            <article class="image-box">
                <img class="filtered" src="https://picsum.photos/id/1015/600/400" alt="Filtered mountain image">
                <h2>After</h2>
                <p>Brightness Filter</p>
            </article>
        </section>
    </main>
</body>
</html>
