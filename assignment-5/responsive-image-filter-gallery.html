<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
    <header>
        <h1>Image Filter Gallery</h1>
        <p>Hover over an image to remove its filter.</p>
    </header>

    <main>
        <section class="gallery">
            <article class="gallery-item">
                <img class="blur" src="https://picsum.photos/id/1015/500/350" alt="Mountain">
                <h2>Blur</h2>
            </article>
            <article class="gallery-item">
                <img class="grayscale" src="https://picsum.photos/id/1016/500/350" alt="Landscape">
                <h2>Grayscale</h2>
            </article>
            <article class="gallery-item">
                <img class="sepia" src="https://picsum.photos/id/1025/500/350" alt="Dog">
                <h2>Sepia</h2>
            </article>
            <article class="gallery-item">
                <img class="brightness" src="https://picsum.photos/id/1035/500/350" alt="Nature">
                <h2>Brightness</h2>
            </article>
            <article class="gallery-item">
                <img class="contrast" src="https://picsum.photos/id/1043/500/350" alt="Forest">
                <h2>Contrast</h2>
            </article>
            <article class="gallery-item">
                <img class="hue" src="https://picsum.photos/id/1050/500/350" alt="Mountain">
                <h2>Hue Rotate</h2>
            </article>
        </section>
    </main>

    <footer><p>CSS Filter Gallery</p></footer>
</body>
</html>
