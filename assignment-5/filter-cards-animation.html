<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="filter-cards-animation.css">
</head>
<body>
    <header>
        <h1>Profile Cards</h1>
    </header>

    <main>
        <section class="profiles">
            <article class="profile-card">
                <img src="https://i.pravatar.cc/400?img=12" alt="Profile of Alex">
                <h2>Alex</h2>
                <p>Web Designer</p>
            </article>

            <article class="profile-card">
                <img src="https://i.pravatar.cc/400?img=32" alt="Profile of Sam">
                <h2>Sam</h2>
                <p>Frontend Developer</p>
            </article>

            <article class="profile-card">
                <img src="https://i.pravatar.cc/400?img=47" alt="Profile of Jordan">
                <h2>Jordan</h2>
                <p>UI Designer</p>
            </article>
        </section>
    </main>
</body>
</html>
